<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Probá el asistente - Kiosco 24</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 48px;
    max-width: 760px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    text-align: center;
  }
  .emoji { font-size: 3rem; margin-bottom: 8px; }
  h1 { margin: 0 0 8px; color: #111; font-size: 1.6rem; }
  p.subtitle { color: #555; margin: 0 0 28px; font-size: 1rem; }
  .qrs {
    display: flex;
    gap: 28px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .qr-item h2 { margin: 0 0 12px; font-size: 1.2rem; }
  .qr-item.whatsapp h2 { color: #128c7e; }
  .qr-item.instagram h2 { color: #c13584; }
  .qr-item.whatsapp .qr-wrap { border-color: #25d366; }
  .qr-item.instagram .qr-wrap { border-color: #c13584; }
  .qr-wrap {
    background: white;
    border: 10px solid #111827;
    border-radius: 20px;
    padding: 16px;
    display: inline-block;
  }
  img { display: block; width: 240px; height: 240px; }
  .estado {
    margin-top: 20px;
    font-size: 0.85rem;
    color: #888;
  }
  .url-actual {
    margin-top: 4px;
    font-size: 0.78rem;
    color: #9ca3af;
    word-break: break-all;
  }
  .url-actual.url-alerta {
    color: #b91c1c;
    font-weight: 600;
  }
  footer {
    margin-top: 24px;
    font-size: 0.85rem;
    color: #6b7280;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📱</div>
    <h1>Escaneá y probá el asistente</h1>
    <p class="subtitle">Es el agente de IA que atiende el WhatsApp y el Instagram de un kiosco. Elegí uno y escribile lo que quieras — respondé una consulta o hacé un pedido.</p>
    <div class="qrs">
      <div class="qr-item whatsapp">
        <h2>WhatsApp</h2>
        <div class="qr-wrap">
          <img class="qr" data-canal="whatsapp" src="/api/qr/whatsapp" alt="QR para probar el asistente por WhatsApp" />
        </div>
      </div>
      <div class="qr-item instagram">
        <h2>Instagram</h2>
        <div class="qr-wrap">
          <img class="qr" data-canal="instagram" src="/api/qr/instagram" alt="QR para probar el asistente por Instagram" />
        </div>
      </div>
    </div>
    <p class="estado" id="estado"></p>
    <p class="url-actual" id="url-actual"></p>
    <footer>Proyecto de expo — Agente de IA para un negocio</footer>
  </div>
  <script>
    const estado = document.getElementById("estado");
    const urlActual = document.getElementById("url-actual");

    document.querySelectorAll("img.qr").forEach((img) => {
      const canal = img.dataset.canal;
      img.addEventListener("error", () => {
        estado.textContent = "No se pudo generar el QR, reintentando...";
        setTimeout(() => { img.src = "/api/qr/" + canal + "?t=" + Date.now(); }, 3000);
      });
      img.addEventListener("load", () => { estado.textContent = ""; });
    });

    // Muestra a qué URL apunta el QR ahora mismo, para detectar a simple
    // vista si quedó apuntando a "localhost" en vez de a la URL de ngrok.
    fetch("/api/public-url")
      .then((r) => r.json())
      .then((data) => {
        const url = data.url || "";
        urlActual.textContent = "Apunta a: " + url;
        if (url.includes("localhost") || url.includes("127.0.0.1")) {
          urlActual.classList.add("url-alerta");
          urlActual.textContent += " ⚠️ (nadie de afuera va a poder abrir esto — configurá PUBLIC_URL en el .env con la URL de ngrok)";
        }
      })
      .catch(() => { urlActual.textContent = ""; });
  </script>
</body>
</html>
